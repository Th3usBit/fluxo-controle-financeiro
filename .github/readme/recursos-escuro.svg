<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Recursos do Fluxo">
<title>Recursos do Fluxo</title>
<style>
text { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.subir { opacity: 0; animation: subir .9s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .subir { opacity: 1; }
}

.cartao { opacity: 0; animation: subir .9s cubic-bezier(.16,1,.3,1) forwards; }
.destaque { opacity: 0; animation: acender 9s ease-in-out infinite; }
@keyframes acender { 0%, 100% { opacity: 0; } 6%, 14% { opacity: 1; } 22% { opacity: 0; } }
.i-barras rect { transform-box: fill-box; transform-origin: bottom; animation: crescerY 2.4s ease-in-out infinite; }
.i-barras rect:nth-child(2) { animation-delay: .25s; } .i-barras rect:nth-child(3) { animation-delay: .5s; }
@keyframes crescerY { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
.i-onda { transform-box: fill-box; transform-origin: center; animation: ondular 1.8s ease-out infinite; }
@keyframes ondular { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.i-raio { animation: flash 1.8s ease-in-out infinite; }
@keyframes flash { 0%, 100% { opacity: 1; } 10% { opacity: .35; } 20% { opacity: 1; } }
.i-faiscas circle { transform-box: view-box; transform-origin: 32px 30px; animation: estourar 2.2s cubic-bezier(.16,1,.3,1) infinite; }
@keyframes estourar { 0% { transform: rotate(var(--a)) translateY(0); opacity: 1; } 70%, 100% { transform: rotate(var(--a)) translateY(-22px); opacity: 0; } }
.i-b1, .i-b2, .i-b3 { transform-box: fill-box; transform-origin: left; animation: encher 3s cubic-bezier(.16,1,.3,1) infinite; }
.i-b2 { animation-delay: .2s; } .i-b3 { animation-delay: .4s; }
@keyframes encher { 0% { transform: scaleX(0); } 40%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.i-lupa { animation: procurar 3s ease-in-out infinite; }
@keyframes procurar { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(14px, -8px); } 66% { transform: translate(8px, 9px); } }
.i-sol { transform-box: fill-box; transform-origin: center; animation: sol 6s ease-in-out infinite; }
@keyframes sol { 0%, 40% { opacity: 1; transform: rotate(0) scale(1); } 50%, 90% { opacity: 0; transform: rotate(90deg) scale(.6); } 100% { opacity: 1; transform: rotate(180deg) scale(1); } }
.i-lua { animation: lua 6s ease-in-out infinite; }
@keyframes lua { 0%, 40% { opacity: 0; } 50%, 90% { opacity: 1; } 100% { opacity: 0; } }
</style>
<defs><linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<g class="cartao" style="animation-delay:0.15s">
  <rect x="1" y="1" width="374" height="278" rx="22" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <rect class="destaque" style="animation-delay:0.0s" x="1" y="1" width="374" height="278" rx="22" fill="none" stroke="url(#borda)" stroke-width="2.5"/>
  <g transform="translate(28 30)">
    <rect width="64" height="64" rx="18" fill="#0f1522" stroke="#242d3e"/>
    
<rect x="14" y="20" width="36" height="26" rx="6" fill="none" stroke="#818cf8" stroke-width="3"/>
<path d="M14 28 h36" stroke="#818cf8" stroke-width="3"/>
<g class="i-barras"><rect x="20" y="34" width="6" height="8" rx="2" fill="#34d399"/><rect x="29" y="34" width="6" height="8" rx="2" fill="#22d3ee"/><rect x="38" y="34" width="6" height="8" rx="2" fill="#818cf8"/></g>
  </g>
  <text x="28" y="140" font-size="25" font-weight="700" fill="#e9edf5">Saldo sempre à vista</text>
  <text x="28" y="182" font-size="17.5" fill="#a3adbd">Receitas, despesas e saldo no topo,</text>
  <text x="28" y="208" font-size="17.5" fill="#a3adbd">atualizados a cada lançamento.</text>
</g>
<g class="cartao" style="animation-delay:0.27s">
  <rect x="413" y="1" width="374" height="278" rx="22" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <rect class="destaque" style="animation-delay:1.5s" x="413" y="1" width="374" height="278" rx="22" fill="none" stroke="url(#borda)" stroke-width="2.5"/>
  <g transform="translate(440 30)">
    <rect width="64" height="64" rx="18" fill="#0f1522" stroke="#242d3e"/>
    
<circle class="i-onda" cx="32" cy="32" r="18" fill="none" stroke="#818cf8" stroke-width="2"/>
<path class="i-raio" d="M35 14 L22 35 h9 l-3 15 l14-22 h-9 z" fill="#818cf8"/>
  </g>
  <text x="440" y="140" font-size="25" font-weight="700" fill="#e9edf5">Lançou, pronto</text>
  <text x="440" y="182" font-size="17.5" fill="#a3adbd">Tipo, valor e categoria. As categorias</text>
  <text x="440" y="208" font-size="17.5" fill="#a3adbd">que você já usa viram sugestão.</text>
</g>
<g class="cartao" style="animation-delay:0.39s">
  <rect x="825" y="1" width="374" height="278" rx="22" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <rect class="destaque" style="animation-delay:3.0s" x="825" y="1" width="374" height="278" rx="22" fill="none" stroke="url(#borda)" stroke-width="2.5"/>
  <g transform="translate(852 30)">
    <rect width="64" height="64" rx="18" fill="#0f1522" stroke="#242d3e"/>
    
<path d="M32 46 V20 m-9 9 l9-9 l9 9" fill="none" stroke="#34d399" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<g class="i-faiscas"><circle style="--a:0deg" cx="32" cy="30" r="2.6" fill="#34d399"/><circle style="--a:45deg" cx="32" cy="30" r="2.6" fill="#34d399"/><circle style="--a:90deg" cx="32" cy="30" r="2.6" fill="#34d399"/><circle style="--a:135deg" cx="32" cy="30" r="2.6" fill="#34d399"/><circle style="--a:180deg" cx="32" cy="30" r="2.6" fill="#34d399"/><circle style="--a:225deg" cx="32" cy="30" r="2.6" fill="#34d399"/><circle style="--a:270deg" cx="32" cy="30" r="2.6" fill="#34d399"/><circle style="--a:315deg" cx="32" cy="30" r="2.6" fill="#34d399"/></g>
  </g>
  <text x="852" y="140" font-size="25" font-weight="700" fill="#e9edf5">Cada entrada celebrada</text>
  <text x="852" y="182" font-size="17.5" fill="#a3adbd">Receita nova chega com brilho verde</text>
  <text x="852" y="208" font-size="17.5" fill="#a3adbd">e o saldo mostra quanto subiu.</text>
</g>
<g class="cartao" style="animation-delay:0.51s">
  <rect x="1" y="321" width="374" height="278" rx="22" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <rect class="destaque" style="animation-delay:4.5s" x="1" y="321" width="374" height="278" rx="22" fill="none" stroke="url(#borda)" stroke-width="2.5"/>
  <g transform="translate(28 350)">
    <rect width="64" height="64" rx="18" fill="#0f1522" stroke="#242d3e"/>
    
<rect x="14" y="17" width="36" height="6" rx="3" fill="#242d3e"/><rect class="i-b1" x="14" y="17" width="36" height="6" rx="3" fill="#818cf8"/>
<rect x="14" y="29" width="36" height="6" rx="3" fill="#242d3e"/><rect class="i-b2" x="14" y="29" width="26" height="6" rx="3" fill="#22d3ee"/>
<rect x="14" y="41" width="36" height="6" rx="3" fill="#242d3e"/><rect class="i-b3" x="14" y="41" width="16" height="6" rx="3" fill="#34d399"/>
  </g>
  <text x="28" y="460" font-size="25" font-weight="700" fill="#e9edf5">Seus hábitos em ordem</text>
  <text x="28" y="502" font-size="17.5" fill="#a3adbd">Categorias organizadas por peso,</text>
  <text x="28" y="528" font-size="17.5" fill="#a3adbd">com a porcentagem de cada uma.</text>
</g>
<g class="cartao" style="animation-delay:0.63s">
  <rect x="413" y="321" width="374" height="278" rx="22" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <rect class="destaque" style="animation-delay:6.0s" x="413" y="321" width="374" height="278" rx="22" fill="none" stroke="url(#borda)" stroke-width="2.5"/>
  <g transform="translate(440 350)">
    <rect width="64" height="64" rx="18" fill="#0f1522" stroke="#242d3e"/>
    
<rect x="12" y="20" width="40" height="4" rx="2" fill="#242d3e"/><rect x="12" y="30" width="30" height="4" rx="2" fill="#242d3e"/><rect x="12" y="40" width="36" height="4" rx="2" fill="#242d3e"/>
<g class="i-lupa"><circle cx="26" cy="30" r="9" fill="#121826" fill-opacity=".6" stroke="#818cf8" stroke-width="3"/><path d="M33 37 l7 7" stroke="#818cf8" stroke-width="3.4" stroke-linecap="round"/></g>
  </g>
  <text x="440" y="460" font-size="25" font-weight="700" fill="#e9edf5">Tudo num instante</text>
  <text x="440" y="502" font-size="17.5" fill="#a3adbd">Busca e filtros que atualizam</text>
  <text x="440" y="528" font-size="17.5" fill="#a3adbd">os totais junto com a lista.</text>
</g>
<g class="cartao" style="animation-delay:0.75s">
  <rect x="825" y="321" width="374" height="278" rx="22" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <rect class="destaque" style="animation-delay:7.5s" x="825" y="321" width="374" height="278" rx="22" fill="none" stroke="url(#borda)" stroke-width="2.5"/>
  <g transform="translate(852 350)">
    <rect width="64" height="64" rx="18" fill="#0f1522" stroke="#242d3e"/>
    
<g class="i-sol"><circle cx="32" cy="32" r="8" fill="#22d3ee"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(0 32 32)"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(45 32 32)"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(90 32 32)"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(135 32 32)"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(180 32 32)"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(225 32 32)"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(270 32 32)"/><rect x="31" y="12" width="2.4" height="7" rx="1.2" fill="#22d3ee" transform="rotate(315 32 32)"/></g>
<g class="i-lua"><path d="M38 18 a14 14 0 1 0 8 25 a11 11 0 1 1 -8 -25 z" fill="#818cf8"/></g>
  </g>
  <text x="852" y="460" font-size="25" font-weight="700" fill="#e9edf5">De dia e de noite</text>
  <text x="852" y="502" font-size="17.5" fill="#a3adbd">Tema claro e escuro, no computador</text>
  <text x="852" y="528" font-size="17.5" fill="#a3adbd">ou no celular.</text>
</g>
</svg>
