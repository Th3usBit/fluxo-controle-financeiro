<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Como o Fluxo funciona">
<title>Como o Fluxo funciona</title>
<style>
text { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.subir { opacity: 0; animation: subir .9s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .subir { opacity: 1; }
}

.particula { animation: fluir 1.8s linear infinite; opacity: 0; }
@keyframes fluir { 0% { transform: translateX(var(--x0)); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(var(--x1)); opacity: 0; } }
</style>
<rect x="1" y="1" width="1198" height="468" rx="26" fill="#0f1522" stroke="#242d3e" stroke-width="1.5"/><text class="subir" x="40" y="90" font-size="17" font-weight="700" letter-spacing="2" fill="#818cf8">NO SITE PUBLICADO</text>
<g class="subir" style="animation-delay:0.2s">
  <rect x="40" y="114" width="320" height="104" rx="20" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <text x="200" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#e9edf5">Você</text>
  <text x="200" y="190" text-anchor="middle" font-size="17" fill="#a3adbd">anota receitas e despesas</text>
</g>
<g class="subir" style="animation-delay:0.4s">
  <rect x="440" y="114" width="320" height="104" rx="20" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <text x="600" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#e9edf5">Fluxo</text>
  <text x="600" y="190" text-anchor="middle" font-size="17" fill="#a3adbd">soma, organiza e mostra</text>
</g>
<g class="subir" style="animation-delay:0.6s">
  <rect x="840" y="114" width="320" height="104" rx="20" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <text x="1000" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#e9edf5">Seu navegador</text>
  <text x="1000" y="190" text-anchor="middle" font-size="17" fill="#a3adbd">guarda tudo, só para você</text>
</g><line x1="368" y1="166" x2="472" y2="166" stroke="#242d3e" stroke-width="2" stroke-dasharray="4 6"/><circle class="particula" style="--x0:368px;--x1:472px;animation-delay:0.0s" cx="0" cy="166" r="5" fill="#34d399"/><circle class="particula" style="--x0:368px;--x1:472px;animation-delay:0.6s" cx="0" cy="166" r="5" fill="#34d399"/><circle class="particula" style="--x0:368px;--x1:472px;animation-delay:1.2s" cx="0" cy="166" r="5" fill="#34d399"/><line x1="768" y1="166" x2="872" y2="166" stroke="#242d3e" stroke-width="2" stroke-dasharray="4 6"/><circle class="particula" style="--x0:768px;--x1:872px;animation-delay:0.3s" cx="0" cy="166" r="5" fill="#34d399"/><circle class="particula" style="--x0:768px;--x1:872px;animation-delay:0.9s" cx="0" cy="166" r="5" fill="#34d399"/><circle class="particula" style="--x0:768px;--x1:872px;animation-delay:1.5s" cx="0" cy="166" r="5" fill="#34d399"/><text class="subir" x="40" y="302" font-size="17" font-weight="700" letter-spacing="2" fill="#818cf8">RODANDO NA SUA MÁQUINA</text>
<g class="subir" style="animation-delay:0.2s">
  <rect x="40" y="326" width="320" height="104" rx="20" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <text x="200" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#e9edf5">Interface</text>
  <text x="200" y="402" text-anchor="middle" font-size="17" fill="#a3adbd">Next.js + React</text>
</g>
<g class="subir" style="animation-delay:0.4s">
  <rect x="440" y="326" width="320" height="104" rx="20" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <text x="600" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#e9edf5">API</text>
  <text x="600" y="402" text-anchor="middle" font-size="17" fill="#a3adbd">Express + validação Zod</text>
</g>
<g class="subir" style="animation-delay:0.6s">
  <rect x="840" y="326" width="320" height="104" rx="20" fill="#121826" stroke="#242d3e" stroke-width="1.5"/>
  <text x="1000" y="370" text-anchor="middle" font-size="24" font-weight="700" fill="#e9edf5">Banco</text>
  <text x="1000" y="402" text-anchor="middle" font-size="17" fill="#a3adbd">SQLite em um arquivo</text>
</g><line x1="368" y1="378" x2="472" y2="378" stroke="#242d3e" stroke-width="2" stroke-dasharray="4 6"/><circle class="particula" style="--x0:368px;--x1:472px;animation-delay:0.0s" cx="0" cy="378" r="5" fill="#22d3ee"/><circle class="particula" style="--x0:368px;--x1:472px;animation-delay:0.6s" cx="0" cy="378" r="5" fill="#22d3ee"/><circle class="particula" style="--x0:368px;--x1:472px;animation-delay:1.2s" cx="0" cy="378" r="5" fill="#22d3ee"/><line x1="768" y1="378" x2="872" y2="378" stroke="#242d3e" stroke-width="2" stroke-dasharray="4 6"/><circle class="particula" style="--x0:768px;--x1:872px;animation-delay:0.3s" cx="0" cy="378" r="5" fill="#22d3ee"/><circle class="particula" style="--x0:768px;--x1:872px;animation-delay:0.9s" cx="0" cy="378" r="5" fill="#22d3ee"/><circle class="particula" style="--x0:768px;--x1:872px;animation-delay:1.5s" cx="0" cy="378" r="5" fill="#22d3ee"/>
</svg>
