<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Privacidade: seus dados ficam com você">
<title>Privacidade: seus dados ficam com você</title>
<style>
text { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.subir { opacity: 0; animation: subir .9s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .subir { opacity: 1; }
}

.anel { transform-box: fill-box; transform-origin: center; animation: anel 3s ease-out infinite; opacity: 0; }
.anel:nth-of-type(2) { animation-delay: 1s; } .anel:nth-of-type(3) { animation-delay: 2s; }
@keyframes anel { from { transform: scale(.7); opacity: .7; } to { transform: scale(1.6); opacity: 0; } }
.cadeado { transform-box: fill-box; transform-origin: center; animation: firme 3s ease-in-out infinite; }
@keyframes firme { 50% { transform: translateY(-4px); } }
.check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: marcar .5s ease-out forwards; }
@keyframes marcar { to { stroke-dashoffset: 0; } }
</style>

<defs><linearGradient id="esc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="338" rx="26" fill="#0f1522" stroke="#242d3e" stroke-width="1.5"/>
<g transform="translate(110 70)">
  <circle class="anel" cx="100" cy="100" r="90" fill="none" stroke="#34d399" stroke-width="2"/>
  <circle class="anel" cx="100" cy="100" r="90" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <circle class="anel" cx="100" cy="100" r="90" fill="none" stroke="#818cf8" stroke-width="2"/>
  <g class="cadeado">
    <path d="M100 30 L160 52 V102 C160 140 134 162 100 174 C66 162 40 140 40 102 V52 Z" fill="url(#esc)"/>
    <rect x="78" y="94" width="44" height="36" rx="7" fill="#fff"/>
    <path d="M86 94 v-10 a14 14 0 0 1 28 0 v10" fill="none" stroke="#fff" stroke-width="7"/>
    <circle cx="100" cy="110" r="5" fill="#6366f1"/><rect x="98" y="110" width="4" height="10" rx="2" fill="#6366f1"/>
  </g>
</g>
<g class="subir" style="animation-delay:0.50s">
  <circle cx="470" cy="92" r="17" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="1.5"/>
  <path class="check" style="animation-delay:0.80s" d="M462 92 l6 6 l11 -12" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="504" y="100" font-size="24" font-weight="600" fill="#e9edf5">Seus dados ficam no seu navegador</text>
</g>
<g class="subir" style="animation-delay:0.85s">
  <circle cx="470" cy="148" r="17" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="1.5"/>
  <path class="check" style="animation-delay:1.15s" d="M462 148 l6 6 l11 -12" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="504" y="156" font-size="24" font-weight="600" fill="#e9edf5">Sem conta, sem login, sem e-mail</text>
</g>
<g class="subir" style="animation-delay:1.20s">
  <circle cx="470" cy="204" r="17" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="1.5"/>
  <path class="check" style="animation-delay:1.50s" d="M462 204 l6 6 l11 -12" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="504" y="212" font-size="24" font-weight="600" fill="#e9edf5">Sem anúncios e sem rastreadores</text>
</g>
<g class="subir" style="animation-delay:1.55s">
  <circle cx="470" cy="260" r="17" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-width="1.5"/>
  <path class="check" style="animation-delay:1.85s" d="M462 260 l6 6 l11 -12" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="504" y="268" font-size="24" font-weight="600" fill="#e9edf5">Código aberto para qualquer pessoa conferir</text>
</g>
</svg>
