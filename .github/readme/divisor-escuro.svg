<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Divisor">
<title>Divisor</title>
<style>
text { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.subir { opacity: 0; animation: subir .9s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .subir { opacity: 1; }
}

.cometa { animation: correr 4.5s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes correr { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
</style>

<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<filter id="h" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<line x1="0" y1="12" x2="1200" y2="12" stroke="#242d3e" stroke-width="1.5"/>
<g class="cometa"><rect x="0" y="9" width="200" height="6" rx="3" fill="url(#g)" filter="url(#h)"/><rect x="40" y="11" width="120" height="2" rx="1" fill="url(#g)"/></g>

</svg>
