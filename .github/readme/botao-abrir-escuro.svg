<svg xmlns="http://www.w3.org/2000/svg" width="440" height="96" viewBox="0 0 440 96" role="img" aria-label="Abrir o Fluxo">
<title>Abrir o Fluxo</title>
<style>
text { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.subir { opacity: 0; animation: subir .9s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .subir { opacity: 1; }
}

.faixa { animation: varrer 3.4s ease-in-out 1s infinite; }
@keyframes varrer { 0%, 45% { transform: translateX(-260px); } 85%, 100% { transform: translateX(560px); } }
.aura { transform-box: fill-box; transform-origin: center; animation: respirar 2.6s ease-in-out infinite; }
@keyframes respirar { 0%, 100% { opacity: .35; transform: scale(.98); } 50% { opacity: .75; transform: scale(1.03); } }
.seta { animation: avancar 1.3s ease-in-out infinite; }
@keyframes avancar { 50% { transform: translateX(6px); } }
</style>

<defs>
  <linearGradient id="fundoa" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="luza" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="sombraa" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="pilulaa"><rect x="16" y="14" width="408" height="64" rx="32"/></clipPath>
</defs>
<rect class="aura" x="20" y="20" width="400" height="60" rx="30" fill="url(#fundoa)" filter="url(#sombraa)"/>
<rect x="16" y="14" width="408" height="64" rx="32" fill="url(#fundoa)"/>
<g clip-path="url(#pilulaa)"><rect class="faixa" x="0" y="0" width="160" height="96" fill="url(#luza)" transform="skewX(-20)"/></g>
<text x="206.0" y="55" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Abrir o Fluxo</text>
<g class="seta"><path d="M318.0 46 h18 m-7 -8 l8 8 l-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>
