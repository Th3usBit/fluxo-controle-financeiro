<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Fluxo: seu dinheiro, com toda a clareza">
<title>Fluxo: seu dinheiro, com toda a clareza</title>
<style>
text { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.subir { opacity: 0; animation: subir .9s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .subir { opacity: 1; }
}

.borda { stroke-dasharray: 260 2900; animation: volta 7s linear infinite; }
@keyframes volta { to { stroke-dashoffset: -3160; } }
.mancha1 { animation: deriva1 14s ease-in-out infinite alternate; }
.mancha2 { animation: deriva2 17s ease-in-out infinite alternate; }
.mancha3 { animation: deriva1 20s ease-in-out infinite alternate-reverse; }
@keyframes deriva1 { to { transform: translate(140px, 60px) scale(1.2); } }
@keyframes deriva2 { to { transform: translate(-160px, -40px) scale(1.15); } }
.onda { stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: desenhar 2.6s cubic-bezier(.65,0,.35,1) .2s forwards; }
@keyframes desenhar { to { stroke-dashoffset: 0; } }
.cometa { offset-path: path('M-40 360 C 220 360, 300 120, 560 140 S 900 330, 1240 250'); offset-rotate: 0deg;
  animation: viajar 5s cubic-bezier(.45,0,.55,1) 2.6s infinite; opacity: 0; }
@keyframes viajar { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
.tracar { stroke-dasharray: 100; stroke-dashoffset: 100; animation: desenhar 1.4s ease .3s forwards; }
.ponta { transform-box: fill-box; transform-origin: center; animation: pulsar 2.4s ease-in-out 1.7s infinite; }
@keyframes pulsar { 50% { transform: scale(1.7); } }
.brilho { animation: cintilar 3.2s ease-in-out infinite; }
@keyframes cintilar { 50% { opacity: .35; } }
</style>

<defs>
  <clipPath id="recorte"><rect x="2" y="2" width="1196" height="436" rx="28"/></clipPath>
  <filter id="desfoque" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="onda" x1="0" x2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset=".6" stop-color="#06b6d4"/><stop offset="1" stop-color="#0f9d6b"/></linearGradient>
  <linearGradient id="feixe" x1="0" x2="1"><stop offset="0" stop-color="#6366f1" stop-opacity="0"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#0f9d6b" stop-opacity="0"/></linearGradient>
  <linearGradient id="titulo" x1="0" x2="1"><stop offset="0" stop-color="#101521"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
</defs>
<rect x="2" y="2" width="1196" height="436" rx="28" fill="#f7f8fb"/>
<g clip-path="url(#recorte)" opacity="0.2">
  <circle class="mancha1" cx="200" cy="80" r="220" fill="#4f46e5" filter="url(#desfoque)"/>
  <circle class="mancha2" cx="1020" cy="380" r="240" fill="#0f9d6b" filter="url(#desfoque)"/>
  <circle class="mancha3" cx="760" cy="40" r="180" fill="#06b6d4" filter="url(#desfoque)"/>
</g>
<g clip-path="url(#recorte)">
  <path class="onda" d="M-40 360 C 220 360, 300 120, 560 140 S 900 330, 1240 250" fill="none" stroke="url(#onda)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <g class="cometa"><circle r="14" fill="#06b6d4" filter="url(#halo)"/><circle r="5" fill="#fff"/></g>
</g>
<rect x="2" y="2" width="1196" height="436" rx="28" fill="none" stroke="#e3e7ee" stroke-width="2"/>
<rect class="borda" x="2" y="2" width="1196" height="436" rx="28" fill="none" stroke="url(#feixe)" stroke-width="3"/>

<g transform="translate(560 64) scale(2.5)">
  <defs><linearGradient id="logob" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect width="32" height="32" rx="9" fill="url(#logob)"/>
  <path class="tracar" d="M6 22c4.6 0 5.3-12 10.5-12S22.4 17.5 27 17.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" pathLength="100"/>
  <circle cx="6" cy="22" r="2.2" fill="#fff"/><circle class="ponta" cx="27" cy="17.5" r="2.2" fill="#fff"/>
</g>
<text class="subir" style="animation-delay:.35s" x="600" y="214" text-anchor="middle" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#titulo)">Fluxo</text>
<text class="subir" style="animation-delay:.6s" x="600" y="276" text-anchor="middle" font-size="34" font-weight="700" fill="#101521">Seu dinheiro, com toda a clareza.</text>
<text class="subir" style="animation-delay:.85s" x="600" y="322" text-anchor="middle" font-size="20" fill="#5a6474">Anote receitas e despesas, acompanhe seu saldo e celebre cada conquista.</text>
<g class="subir" style="animation-delay:1.1s">
  <text x="600" y="372" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="2" fill="#6366f1">GRÁTIS  ·  SEM CADASTRO  ·  DIRETO NO NAVEGADOR</text>
</g>

</svg>
